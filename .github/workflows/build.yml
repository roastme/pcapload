name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse game data in the repo
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Recurse -File |
                 Where-Object { $_.Extension -in '.cab', '.dll', '.7z' }
          if ($bad) {
            $bad | ForEach-Object { Write-Host $_.FullName }
            throw "Game data must not be committed (see .gitignore)."
          }

      - name: Build (32-bit MSVC)
        shell: cmd
        run: build.bat

      - name: Verify PE32 / i386
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("pcapload.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          Write-Host ("PE machine = 0x{0:X4}" -f $machine)
          if ($machine -ne 0x014C) { throw "pcapload.exe is not 32-bit" }

      - uses: actions/upload-artifact@v4
        with:
          name: pcapload-x86
          path: pcapload.exe
          if-no-files-found: error
